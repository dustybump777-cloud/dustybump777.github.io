<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/// CYBER_MATRIX_V1.0 ///</title>
    <style>
        /* Global Y2K Base Styles */
        body {
            font-family: "Courier New", Courier, monospace;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 🎥 Fullscreen YouTube Wrapper Container */
        .video-background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2; /* Keeps video behind everything */
            pointer-events: none; /* Prevents users from clicking the video pause buttons */
            overflow: hidden;
        }

        /* Stretches the YouTube iframe to cover the screen */
        .video-background-container iframe {
            width: 100vw;
            height: 56.25vw; /* Given standard 16:9 ratio */
            min-height: 100vh;
            min-width: 177.77vh; /* Forces widescreen video scaling */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Centers the cropped frame */
        }

        /* Y2K Scanline & Tint Overlay */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255, 0, 0, 0.08) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px; 
            z-index: -1; /* Sits between the video and text content */
            pointer-events: none;
        }

        /* Retro Title Header */
        h1 {
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 2rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0px #ffffff;
            border-bottom: 2px dashed #ff0000;
            padding-bottom: 10px;
            text-align: center;
            position: relative;
        }

        /* 3-Column Grid Container */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px; 
            max-width: 1000px;
            width: 100%;
            position: relative;
        }

        /* Chunky Beveled Y2K Interface Box */
        .grid-box {
            background-color: rgba(0, 0, 0, 0.85); 
            border: 4px double #ff0000; 
            text-decoration: none; 
            color: #ffffff;
            display: flex;
            flex-direction: column;
            transition: all 0.15s ease-in-out;
        }

        .grid-box:hover {
            border-color: #ffffff;
            transform: translate(-4px, -4px);
            box-shadow: 6px 6px 0px #ff0000; 
        }

        .grid-box img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            border-bottom: 2px solid #ff0000;
            filter: grayscale(30%) contrast(120%);
        }

        .grid-box:hover img {
            filter: grayscale(0%) contrast(100%);
        }

        .grid-box span {
            padding: 12px;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            background-color: rgba(17, 17, 17, 0.9);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid-box:hover span {
            background-color: #ff0000;
            color: #000000;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- 🎥 YouTube Background Wrapper -->
    <div class="video-background-container">
        <!-- Replace YOUR_VIDEO_ID in both spots in the link below -->
        <iframe src="https://youtube.com" 
                frameborder="0" 
                allow="autoplay; encrypted-media" 
                allowfullscreen>
        </iframe>
    </div>

    <!-- Retro CRT Monitor Scanline Tint Layer -->
    <div class="video-overlay"></div>

    <h1>[ ENTER_THE_SYSTEM ]</h1>

    <div class="grid-container">

        <a href="page1.html" class="grid-box">

            <span>// SUBPAGE_01 //</span>
        </a>
        <!-- Box 2 -->

        </a>
        <!-- Box 3 -->
        <a href="page3.html" class="grid-box">

        </a>
        <!-- Box 4 -->

        </a>

</body>
