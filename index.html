<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/// CYBER_MATRIX_V1.0 ///</title>
    <style>
        body {
            font-family: "Courier New", Courier, monospace;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Video Background */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* Y2K Scanline Overlay */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255, 0, 0, 0.08) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px; 
            z-index: -1;
            pointer-events: none;
        }

        h1 {
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 2rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0px #ffffff;
            border-bottom: 2px dashed #ff0000;
            padding-bottom: 10px;
            text-align: center;
            position: relative;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px; 
            max-width: 1000px;
            width: 100%;
            position: relative;
        }

        .grid-box {
            background-color: rgba(0, 0, 0, 0.85); 
            border: 4px double #ff0000; 
            text-decoration: none; 
            color: #ffffff;
            display: flex;
            flex-direction: column;
            transition: all 0.15s ease-in-out;
        }

        .grid-box:hover {
            border-color: #ffffff;
            transform: translate(-4px, -4px);
            box-shadow: 6px 6px 0px #ff0000; 
        }

        .grid-box img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            border-bottom: 2px solid #ff0000;
            filter: grayscale(30%) contrast(120%);
        }

        .grid-box:hover img {
            filter: grayscale(0%) contrast(100%);
        }

        .grid-box span {
            padding: 12px;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            background-color: rgba(17, 17, 17, 0.9);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid-box:hover span {
            background-color: #ff0000;
            color: #000000;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        /* Early 2000s Media Player Styles */
        .media-player-2000s {
            width: 320px;
            background: linear-gradient(180deg, #2b2b2b 0%, #111111 50%, #000000 100%);
            border: 2px solid #ff0000;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4), inset 0 0 4px #555;
            padding: 6px;
            font-family: 'Courier New', Courier, monospace;
            color: #ff0000;
            user-select: none;
            margin-bottom: 20px;
        }

        .player-titlebar {
            background: linear-gradient(90deg, #800000 0%, #000000 100%);
            border: 1px solid #ff0000;
            padding: 3px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .player-title {
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 1px 1px 2px #ff0000;
        }

        .win-btn {
            color: #ff0000;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 4px;
            padding: 0 3px;
            border: 1px solid #ff0000;
            background: #000;
        }

        .player-display {
            background: #050505;
            border: 2px inset #333;
            padding: 6px;
            margin-bottom: 8px;
            box-shadow: inset 0 0 8px rgba(255, 0, 0, 0.6);
        }

        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            background: #000;
            border: 1px solid #300;
            padding: 2px;
            margin-bottom: 4px;
        }

        .track-text {
            display: inline-block;
            font-size: 11px;
            color: #ff0000;
            text-shadow: 0 0 5px #ff0000;
        }

        .display-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .led-time {
            font-size: 18px;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 0 0 8px #ff0000;
        }

        .kbps-badge {
            font-size: 9px;
            background: #200;
            color: #ff3333;
            padding: 1px 4px;
            border: 1px solid #ff0000;
        }

        .player-controls {
            display: flex;
            justify-content: space-between;
            gap: 4px;
            margin-bottom: 6px;
        }

        .player-btn {
            flex: 1;
            background: linear-gradient(180deg, #444 0%, #111 100%);
            color: #ff0000;
            border: 1px solid #ff0000;
            padding: 6px 0;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 1px 1px 0px #800000;
            text-shadow: 0 0 3px #ff0000;
        }

        .player-btn:active {
            background: #ff0000;
            color: #000000;
            box-shadow: inset 1px 1px 2px #000;
        }

        .simple-vol {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            color: #ff0000;
            font-weight: bold;
        }

        /* Slider Track */
        input[type="range"]#volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: #000;
            border: 1px solid #ff0000;
            outline: none;
            cursor: pointer;
        }

        /* Slider Thumb (Red Handle) */
        input[type="range"]#volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 8px;
            height: 12px;
            background: #ff0000;
            border: 1px solid #000;
            cursor: pointer;
        }

        input[type="range"]#volume-slider::-moz-range-thumb {
            width: 8px;
            height: 12px;
            background: #ff0000;
            border: 1px solid #000;
            cursor: pointer;
        }

        /* --- Y2K Playlist Window --- */
        .playlist-box {
            background-color: #050000;
            border: 2px inset #333;
            padding: 4px;
            margin-top: 6px;
            box-shadow: inset 0 0 4px #ff0000;
        }

        .playlist-header {
            font-size: 9px;
            color: #880000;
            text-align: center;
            border-bottom: 1px dashed #440000;
            padding-bottom: 2px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .playlist-list {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 80px;
            overflow-y: auto;
            font-size: 10px;
        }

        /* Scrollbar Styling */
        .playlist-list::-webkit-scrollbar {
            width: 6px;
        }

        .playlist-list::-webkit-scrollbar-track {
            background: #111;
        }

        .playlist-list::-webkit-scrollbar-thumb {
            background: #ff0000;
        }

        .playlist-item {
            padding: 3px 4px;
            cursor: pointer;
            color: #880000;
            display: flex;
            justify-content: space-between;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item:hover {
            background-color: #220000;
            color: #ff5555;
        }

        .playlist-item.active {
            background-color: #ff0000;
            color: #000000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Video Background -->
    <video class="video-background" autoplay loop muted playsinline>
        <source src="Normview.0.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>
    
    <div class="media-player-2000s">
      <!-- Title Bar -->
      <div class="player-titlebar">
        <span class="player-title">WIN-PLAYER v1.0 [RED_SKIN.wsz]</span>
        <div class="titlebar-controls">
          <span class="win-btn">_</span>
          <span class="win-btn">X</span>
        </div>
      </div>

      <!-- Display Panel -->
      <div class="player-display">
        <div class="marquee-container">
          <span class="track-text" id="trackTitle">SELECT A TRACK</span>
        </div>
        <div class="display-stats">
          <span class="led-time" id="timeDisplay">00:00</span>
          <span class="kbps-badge">STEREO</span>
        </div>
      </div>

      <!-- Volume Slider -->
      <div class="simple-vol">
        <label for="volume-slider">VOL</label>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
      </div>

      <!-- Control Buttons -->
      <div class="player-controls">
        <button class="player-btn" onclick="prevTrack()">&#9664;&#9664;</button>
        <button class="player-btn btn-play" id="playBtn" onclick="togglePlay()">&#9654;</button>
        <button class="player-btn" onclick="stopTrack()">&#9632;</button>
        <button class="player-btn" onclick="nextTrack()">&#9654;&#9654;</button>
      </div>

      <!-- Y2K Playlist Drawer -->
      <div class="playlist-box">
        <div class="playlist-header">=== PLAYLIST ===</div>
        <ul class="playlist-list" id="playlist"></ul>
      </div>

      <!-- Hidden Native Audio Element -->
      <audio id="audioSource"></audio>
    </div>
    
    <!-- Retro CRT Monitor Scanline Layer -->
    <div class="video-overlay"></div>

    <h1>[ ENTER_THE_SYSTEM ]</h1>

    <div class="grid-container">
        <a href="page1.html" class="grid-box">
            <img src="dobiTiles.5.jpg" alt="Subpage 01">
            <span>// SUBPAGE_01 //</span>
        </a>
        <a href="page2.html" class="grid-box">
            <img src="" alt="Subpage 02">
            <span>// SUBPAGE_02 //</span>
        </a>
        <a href="page3.html" class="grid-box">
            <img src="" alt="Subpage 03">
            <span>// SUBPAGE_03 //</span>
        </a>
        <a href="page4.html" class="grid-box">
            <img src="" alt="Subpage 04">
            <span>// SUBPAGE_04 //</span>
        </a>
        <a href="page5.html" class="grid-box">
            <img src="" alt="Subpage 05">
            <span>// SUBPAGE_05 //</span>
        </a>
        <a href="page6.html" class="grid-box">
            <img src="" alt="Subpage 06">
            <span>// SUBPAGE_06 //</span>
        </a>
    </div>

<script>
    // 1. ADD YOUR TRACKS HERE (Update 'src' with your actual file names/paths)
    const tracks = [
        { title: "2 sick horses HWJ.mp3", src: "2 sick horses HWJ.mp3" },
        { title: "Boards Like jam.mp3", src: "Boards Like jam.mp3" },
        { title: "brooding morning.mp3", src: "brooding morning.mp3" },
        { title: "Vincents Calm.mp3", src: "Vincents Calm.mp3" }
    ];

    let currentTrackIndex = 0;

    // Elements
    const audio = document.getElementById('audioSource');
    const volumeSlider = document.getElementById('volume-slider');
    const playBtn = document.getElementById('playBtn');
    const timeDisplay = document.getElementById('timeDisplay');
    const trackTitleDisplay = document.getElementById('trackTitle');
    const playlistUI = document.getElementById('playlist');

    // Set initial volume
    audio.volume = volumeSlider.value;

    // Volume Slider Event
    volumeSlider.addEventListener('input', (e) => {
        audio.volume = e.target.value;
    });

    // Populate Playlist UI
    function initPlaylist() {
        playlistUI.innerHTML = '';
        tracks.forEach((track, index) => {
            const li = document.createElement('li');
            li.className = `playlist-item ${index === currentTrackIndex ? 'active' : ''}`;
            li.textContent = track.title;
            
            li.addEventListener('click', () => {
                loadTrack(index);
                audio.play();
                playBtn.innerHTML = "&#10074;&#10074;";
            });
            
            playlistUI.appendChild(li);
        });
    }

    // Load Track by Index
    function loadTrack(index) {
        currentTrackIndex = index;
        audio.src = tracks[index].src;
        trackTitleDisplay.textContent = tracks[index].title.toUpperCase();

        // Highlight Active Row in Playlist
        const items = playlistUI.querySelectorAll('.playlist-item');
        items.forEach((item, i) => {
            item.classList.toggle('active', i === currentTrackIndex);
        });
    }

    // Play / Pause Toggle
    function togglePlay() {
        if (audio.paused) {
            audio.play().catch(err => console.error("Audio error:", err));
            playBtn.innerHTML = "&#10074;&#10074;"; // Pause symbol
        } else {
            audio.pause();
            playBtn.innerHTML = "&#9654;"; // Play symbol
        }
    }

    // Stop Track
    function stopTrack() {
        audio.pause();
        audio.currentTime = 0;
        playBtn.innerHTML = "&#9654;";
    }

    // Previous Track
    function prevTrack() {
        currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
        loadTrack(currentTrackIndex);
        audio.play();
        playBtn.innerHTML = "&#10074;&#10074;";
    }

    // Next Track
    function nextTrack() {
        currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
        loadTrack(currentTrackIndex);
        audio.play();
        playBtn.innerHTML = "&#10074;&#10074;";
    }

    // Auto-play Next Song when Current Ends
    audio.addEventListener('ended', () => {
        nextTrack();
    });

    // Update LED Time
    audio.addEventListener('timeupdate', () => {
        const mins = Math.floor(audio.currentTime / 60).toString().padStart(2, '0');
        const secs = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
        timeDisplay.textContent = `${mins}:${secs}`;
    });

    // Initialize Player
    initPlaylist();
    loadTrack(0);
</script>

</body>
</html>
