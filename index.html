<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/// CYBER_MATRIX_V1.0 ///</title>
    <style>
        body {
            font-family: "Courier New", Courier, monospace;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 🎥 Local HTML5 Video Background */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Stretches the video cleanly to fill the screen */
            z-index: -2; /* Keeps video behind everything */
        }

        /* Y2K Scanline Overlay */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255, 0, 0, 0.08) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px; 
            z-index: -1;
            pointer-events: none;
        }

        h1 {
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 2rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0px #ffffff;
            border-bottom: 2px dashed #ff0000;
            padding-bottom: 10px;
            text-align: center;
            position: relative;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px; 
            max-width: 1000px;
            width: 100%;
            position: relative;
        }

        .grid-box {
            background-color: rgba(0, 0, 0, 0.85); 
            border: 4px double #ff0000; 
            text-decoration: none; 
            color: #ffffff;
            display: flex;
            flex-direction: column;
            transition: all 0.15s ease-in-out;
        }

        .grid-box:hover {
            border-color: #ffffff;
            transform: translate(-4px, -4px);
            box-shadow: 6px 6px 0px #ff0000; 
        }

        .grid-box img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            border-bottom: 2px solid #ff0000;
            filter: grayscale(30%) contrast(120%);
        }

        .grid-box:hover img {
            filter: grayscale(0%) contrast(100%);
        }

        .grid-box span {
            padding: 12px;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            background-color: rgba(17, 17, 17, 0.9);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid-box:hover span {
            background-color: #ff0000;
            color: #000000;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- 🎥 Linked directly to your uploaded video -->
    <video class="video-background" autoplay loop muted playsinline>
        <source src="Hwj 27 10 25.mp4" type="video/mp4">
        Your browser does not support HTML5 video.

    <!-- Retro CRT Monitor Scanline Layer -->
    <div class="video-overlay"></div>

        </a>
        <a href="page2.html" class="grid-box">

        </a>
        <a href="page3.html" class="grid-box">

        <a href="page6.html" class="grid-box">

    </div>
